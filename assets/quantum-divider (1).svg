<svg viewBox="0 0 1200 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.75"/>
      <stop offset="85%" stop-color="#00d4ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main wire -->
  <line x1="0" y1="18" x2="1200" y2="18" stroke="url(#wire)" stroke-width="1.6"/>

  <!-- Entangled node pair (left) -->
  <g filter="url(#dglow)">
    <circle cx="330" cy="18" r="4" fill="#00d4ff">
      <animate attributeName="r" values="3.5;5;3.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="18" r="4" fill="#f5a623">
      <animate attributeName="r" values="5;3.5;5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central atom node -->
  <g filter="url(#dglow)">
    <circle cx="600" cy="18" r="7" fill="none" stroke="#a78bfa" stroke-width="1.3">
      <animateTransform attributeName="transform" type="rotate" from="0 600 18" to="360 600 18" dur="6s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="600" cy="18" rx="13" ry="5" fill="none" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="0 600 18" to="-360 600 18" dur="8s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="600" cy="18" r="2.6" fill="#e9d5ff"/>
  </g>

  <!-- Photon pulses travelling in both directions -->
  <circle r="3" fill="#00d4ff" filter="url(#dglow)">
    <animateMotion path="M 0,18 L 1200,18" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#f5a623" filter="url(#dglow)">
    <animateMotion path="M 1200,18 L 0,18" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="6.5s" repeatCount="indefinite"/>
  </circle>
</svg>

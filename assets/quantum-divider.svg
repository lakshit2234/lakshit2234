<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 50" width="1200" height="50" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dgl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- entangled waves -->
  <path id="wTop" d="M0,25 C150,5 300,5 450,25 C600,45 750,45 900,25 C1050,5 1150,5 1200,25"
        fill="none" stroke="url(#dg)" stroke-width="1.6" opacity="0.7"/>
  <path id="wBot" d="M0,25 C150,45 300,45 450,25 C600,5 750,5 900,25 C1050,45 1150,45 1200,25"
        fill="none" stroke="url(#dg)" stroke-width="1.6" opacity="0.7"/>

  <!-- entangled photons travelling opposite directions -->
  <circle r="4" fill="#00d4ff" filter="url(#dgl)">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#wTop"/></animateMotion>
  </circle>
  <circle r="4" fill="#7c3aed" filter="url(#dgl)">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#wBot"/></animateMotion>
  </circle>

  <!-- center node -->
  <circle cx="600" cy="25" r="5" fill="#0a1422" stroke="#a78bfa" stroke-width="1.6">
    <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Lakshit Saini - AI and Quantum ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06080f"/>
      <stop offset="50%" stop-color="#0a1422"/>
      <stop offset="100%" stop-color="#070d18"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#9b8cff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <radialGradient id="qglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="bigGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <!-- elliptical orbit path centered at origin -->
    <path id="orbit" d="M -78,0 a 78,28 0 1,0 156,0 a 78,28 0 1,0 -156,0"/>

    <clipPath id="nameClip">
      <text x="640" y="172" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="4">LAKSHIT SAINI</text>
    </clipPath>
  </defs>

  <!-- background -->
  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- floating quantum particles -->
  <g fill="#00d4ff">
    <circle cx="380" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="48" r="2.4" fill="#7c3aed"><animate attributeName="opacity" values="0;1;0" dur="4.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="300" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="120" r="2.2" fill="#9b8cff"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="320" r="2"><animate attributeName="opacity" values="0;1;0" dur="4.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="40" r="1.8" fill="#7c3aed"><animate attributeName="opacity" values="0;1;0" dur="3.0s" begin="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- LEFT: quantum atom with orbiting electrons -->
  <g transform="translate(150,180)">
    <circle r="44" fill="url(#qglow)">
      <animate attributeName="r" values="40;48;40" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" fill="#00d4ff" filter="url(#soft)"/>
    <circle r="6" fill="#ffffff"/>

    <g transform="rotate(0)">
      <use href="#orbit" fill="none" stroke="#1d6fb8" stroke-width="1.2" opacity="0.55"/>
      <circle r="4.5" fill="#00d4ff">
        <animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
      </circle>
    </g>
    <g transform="rotate(60)">
      <use href="#orbit" fill="none" stroke="#5b4bbf" stroke-width="1.2" opacity="0.55"/>
      <circle r="4.5" fill="#9b8cff">
        <animateMotion dur="4.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
      </circle>
    </g>
    <g transform="rotate(120)">
      <use href="#orbit" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.55"/>
      <circle r="4.5" fill="#7c3aed">
        <animateMotion dur="3.0s" begin="0.9s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion>
      </circle>
    </g>
  </g>

  <!-- RIGHT: mini neural network with traveling activations -->
  <g stroke="#173a55" stroke-width="1.2" fill="none" opacity="0.9">
    <line x1="1050" y1="120" x2="1130" y2="100"/>
    <line x1="1050" y1="120" x2="1130" y2="180"/>
    <line x1="1050" y1="120" x2="1130" y2="260"/>
    <line x1="1050" y1="260" x2="1130" y2="100"/>
    <line x1="1050" y1="260" x2="1130" y2="180"/>
    <line x1="1050" y1="260" x2="1130" y2="260"/>
    <line x1="1130" y1="100" x2="1210" y2="180"/>
    <line x1="1130" y1="180" x2="1210" y2="180"/>
    <line x1="1130" y1="260" x2="1210" y2="180"/>
  </g>
  <g fill="#0a1422" stroke="#00d4ff" stroke-width="1.6">
    <circle cx="1050" cy="120" r="7"><animate attributeName="stroke" values="#00d4ff;#7c3aed;#00d4ff" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="260" r="7"><animate attributeName="stroke" values="#7c3aed;#00d4ff;#7c3aed" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="100" r="7"/>
    <circle cx="1130" cy="180" r="7"/>
    <circle cx="1130" cy="260" r="7"/>
    <circle cx="1210" cy="180" r="8" stroke="#9b8cff"><animate attributeName="r" values="8;10;8" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>
  <!-- pulse travelling through net -->
  <circle r="3.5" fill="#ffffff" filter="url(#soft)">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M1050,120 L1130,180 L1210,180"/>
  </circle>
  <circle r="3" fill="#9b8cff" filter="url(#soft)">
    <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M1050,260 L1130,100 L1210,180"/>
  </circle>

  <!-- BOTTOM: quantum circuit strip -->
  <g stroke="#1d6fb8" stroke-width="1.4" opacity="0.85">
    <line x1="330" y1="318" x2="950" y2="318"/>
    <line x1="330" y1="342" x2="950" y2="342"/>
  </g>
  <!-- gates -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#00d4ff" text-anchor="middle">
    <rect x="402" y="306" width="24" height="24" rx="4" fill="#0a1422" stroke="#00d4ff"/><text x="414" y="322">H</text>
    <rect x="560" y="306" width="24" height="24" rx="4" fill="#0a1422" stroke="#9b8cff"/><text x="572" y="322" fill="#9b8cff">X</text>
    <rect x="700" y="330" width="24" height="24" rx="4" fill="#0a1422" stroke="#7c3aed"/><text x="712" y="346" fill="#7c3aed">H</text>
  </g>
  <!-- CNOT entanglement -->
  <line x1="850" y1="318" x2="850" y2="342" stroke="#f5a623" stroke-width="1.6"/>
  <circle cx="850" cy="318" r="4" fill="#f5a623"/>
  <circle cx="850" cy="342" r="7" fill="none" stroke="#f5a623" stroke-width="1.6"/>
  <line x1="846" y1="342" x2="854" y2="342" stroke="#f5a623" stroke-width="1.6"/>
  <line x1="850" y1="338" x2="850" y2="346" stroke="#f5a623" stroke-width="1.6"/>
  <!-- travelling qubit pulses -->
  <circle r="4" fill="#00d4ff" filter="url(#soft)"><animateMotion dur="3.6s" repeatCount="indefinite" path="M330,318 L950,318"/></circle>
  <circle r="4" fill="#7c3aed" filter="url(#soft)"><animateMotion dur="4.2s" begin="0.5s" repeatCount="indefinite" path="M330,342 L950,342"/></circle>

  <!-- NAME with gradient + animated sheen -->
  <text x="640" y="172" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="4" fill="url(#nameGrad)">LAKSHIT SAINI
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <g clip-path="url(#nameClip)">
    <rect x="-260" y="100" width="200" height="100" fill="#ffffff" opacity="0.45" filter="url(#bigGlow)" transform="skewX(-18)">
      <animate attributeName="x" values="-260;900" dur="3.8s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- animated underline draw -->
  <line x1="430" y1="196" x2="850" y2="196" stroke="url(#nameGrad)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="420" stroke-dashoffset="420">
    <animate attributeName="stroke-dashoffset" from="420" to="0" dur="1.4s" begin="0.8s" fill="freeze"/>
  </line>

  <!-- subtitle -->
  <text x="640" y="236" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" letter-spacing="2" fill="#9fb6c9" opacity="0">
    AI Engineer · LLM &amp; Agentic Systems · Quantum ML Explorer
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="1.6s" fill="freeze"/>
  </text>

  <!-- tag chips -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="12" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="2.2s" fill="freeze"/>
    <g>
      <rect x="468" y="262" width="98" height="26" rx="13" fill="#0a1422" stroke="#00d4ff" stroke-opacity="0.5"/>
      <text x="517" y="279" fill="#00d4ff">Diffusion</text>
    </g>
    <g>
      <rect x="576" y="262" width="118" height="26" rx="13" fill="#0a1422" stroke="#9b8cff" stroke-opacity="0.5"/>
      <text x="635" y="279" fill="#9b8cff">Agentic AI</text>
    </g>
    <g>
      <rect x="704" y="262" width="108" height="26" rx="13" fill="#0a1422" stroke="#7c3aed" stroke-opacity="0.5"/>
      <text x="758" y="279" fill="#b39bff">Quantum</text>
    </g>
  </g>
</svg>

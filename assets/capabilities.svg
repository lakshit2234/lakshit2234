<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="100%" stop-color="#070d1c"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/><stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#be185d"/><stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="cglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl { fill:#cbd5e1; font-size:15px; }
      .pct { fill:#7dd3fc; font-size:14px; font-weight:bold; }
      .track { fill:#13233f; rx:6; }
      .fadeIn { animation: f 0.5s ease both; }
      @keyframes f { from{opacity:0} to{opacity:1} }
    </style>
  </defs>

  <!-- Panel -->
  <rect x="2" y="2" width="756" height="436" rx="16" fill="url(#panel)" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Terminal header -->
  <circle cx="28" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="28" r="6" fill="#febc2e"/>
  <circle cx="68" cy="28" r="6" fill="#28c840"/>
  <text x="380" y="33" text-anchor="middle" fill="#64ffda" font-size="15" letter-spacing="2">~/lakshit/core_capabilities --benchmark</text>
  <line x1="2" y1="48" x2="758" y2="48" stroke="#1e3a5f" stroke-width="1.2"/>

  <!-- Bar 1: Agentic AI -->
  <text class="lbl" x="36" y="86">🤖 Agentic AI &amp; LLM Systems</text>
  <rect class="track" x="36" y="96" width="600" height="13" rx="6"/>
  <rect x="36" y="96" height="13" rx="6" fill="url(#barCyan)" filter="url(#cglow)" width="552">
    <animate attributeName="width" from="0" to="552" dur="1.4s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text class="pct fadeIn" x="652" y="108" style="animation-delay:1.6s">92%</text>

  <!-- Bar 2: Generative Models -->
  <text class="lbl" x="36" y="146">🌀 Generative Models (Diffusion · DDPM)</text>
  <rect class="track" x="36" y="156" width="600" height="13" rx="6"/>
  <rect x="36" y="156" height="13" rx="6" fill="url(#barPurple)" filter="url(#cglow)" width="528">
    <animate attributeName="width" from="0" to="528" dur="1.4s" begin="0.55s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text class="pct fadeIn" x="652" y="168" style="animation-delay:1.85s">88%</text>

  <!-- Bar 3: Deep Learning -->
  <text class="lbl" x="36" y="206">🧠 Deep Learning (PyTorch · HF Transformers)</text>
  <rect class="track" x="36" y="216" width="600" height="13" rx="6"/>
  <rect x="36" y="216" height="13" rx="6" fill="url(#barGold)" filter="url(#cglow)" width="540">
    <animate attributeName="width" from="0" to="540" dur="1.4s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text class="pct fadeIn" x="652" y="228" style="animation-delay:2.1s">90%</text>

  <!-- Bar 4: Speech & Signal -->
  <text class="lbl" x="36" y="266">🗣️ Speech AI &amp; Signal Processing</text>
  <rect class="track" x="36" y="276" width="600" height="13" rx="6"/>
  <rect x="36" y="276" height="13" rx="6" fill="url(#barGreen)" filter="url(#cglow)" width="504">
    <animate attributeName="width" from="0" to="504" dur="1.4s" begin="1.05s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text class="pct fadeIn" x="652" y="288" style="animation-delay:2.35s">84%</text>

  <!-- Bar 5: Computer Vision -->
  <text class="lbl" x="36" y="326">👁️ Computer Vision (OpenCV · MediaPipe)</text>
  <rect class="track" x="36" y="336" width="600" height="13" rx="6"/>
  <rect x="36" y="336" height="13" rx="6" fill="url(#barPink)" filter="url(#cglow)" width="480">
    <animate attributeName="width" from="0" to="480" dur="1.4s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <text class="pct fadeIn" x="652" y="348" style="animation-delay:2.6s">80%</text>

  <!-- Bar 6: Quantum ML — charging, indeterminate pulse -->
  <text class="lbl" x="36" y="386">⚛️ Quantum ML &amp; QFL</text>
  <rect class="track" x="36" y="396" width="600" height="13" rx="6"/>
  <rect x="36" y="396" height="13" rx="6" fill="url(#barCyan)" opacity="0.9" width="210">
    <animate attributeName="width" from="0" to="210" dur="1.4s" begin="1.55s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
  </rect>
  <!-- scanning charge pulse over the quantum bar -->
  <rect y="396" height="13" rx="6" width="46" fill="#e0f2fe" opacity="0">
    <animate attributeName="x" values="36;200" dur="1.8s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0" dur="1.8s" begin="3s" repeatCount="indefinite"/>
  </rect>
  <text class="pct fadeIn" x="652" y="408" style="animation-delay:2.9s" fill="#a78bfa">⚡ charging…</text>

  <!-- Footer caption -->
  <text x="380" y="432" text-anchor="middle" fill="#475569" font-size="12">benchmark complete · next eval: post-quantum</text>
</svg>

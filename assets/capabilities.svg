<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Core capabilities">
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a7fb5"/><stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="q" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b21b6"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="760" height="470" rx="16" fill="#0a1422"/>
  <text x="32" y="50" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" font-weight="700" fill="#00d4ff">// CORE_WEIGHTS</text>
  <text x="728" y="50" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#5d7689">model: lakshit-v3.2</text>

  <!-- rows: label, track, animated fill, % -->
  <!-- helper layout: x label 32, track x=240 w=400 h=14, y start 92 step 50 -->

  <!-- 1 LLM Engineering 92 c -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="32" y="96" font-size="13" fill="#cfe3f0">llm_engineering</text>
    <rect x="240" y="84" width="400" height="14" rx="7" fill="#10283a"/>
    <rect x="240" y="84" width="0" height="14" rx="7" fill="url(#c)">
      <animate attributeName="width" from="0" to="368" dur="1.5s" begin="0.1s" fill="freeze"/>
    </rect>
    <text x="652" y="96" font-size="12" fill="#00d4ff">92%</text>
  </g>

  <!-- 2 Research Depth 90 c -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="32" y="146" font-size="13" fill="#cfe3f0">research_depth</text>
    <rect x="240" y="134" width="400" height="14" rx="7" fill="#10283a"/>
    <rect x="240" y="134" width="0" height="14" rx="7" fill="url(#c)">
      <animate attributeName="width" from="0" to="360" dur="1.5s" begin="0.25s" fill="freeze"/>
    </rect>
    <text x="652" y="146" font-size="12" fill="#00d4ff">90%</text>
  </g>

  <!-- 3 Deep Learning 87 c -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="32" y="196" font-size="13" fill="#cfe3f0">deep_learning</text>
    <rect x="240" y="184" width="400" height="14" rx="7" fill="#10283a"/>
    <rect x="240" y="184" width="0" height="14" rx="7" fill="url(#c)">
      <animate attributeName="width" from="0" to="348" dur="1.5s" begin="0.4s" fill="freeze"/>
    </rect>
    <text x="652" y="196" font-size="12" fill="#00d4ff">87%</text>
  </g>

  <!-- 4 Paper Writing 88 c -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="32" y="246" font-size="13" fill="#cfe3f0">paper_writing</text>
    <rect x="240" y="234" width="400" height="14" rx="7" fill="#10283a"/>
    <rect x="240" y="234" width="0" height="14" rx="7" fill="url(#c)">
      <animate attributeName="width" from="0" to="352" dur="1.5s" begin="0.55s" fill="freeze"/>
    </rect>
    <text x="652" y="246" font-size="12" fill="#00d4ff">88%</text>
  </g>

  <!-- 5 Quantum ML 70 q -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="32" y="296" font-size="13" fill="#d8ccff">quantum_ml ⚛</text>
    <rect x="240" y="284" width="400" height="14" rx="7" fill="#1c1633"/>
    <rect x="240" y="284" width="0" height="14" rx="7" fill="url(#q)">
      <animate attributeName="width" from="0" to="280" dur="1.6s" begin="0.7s" fill="freeze"/>
    </rect>
    <text x="652" y="296" font-size="12" fill="#a78bfa">70%</text>
  </g>

  <!-- 6 Quantum FL 65 q -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="32" y="346" font-size="13" fill="#d8ccff">quantum_fl ⚛</text>
    <rect x="240" y="334" width="400" height="14" rx="7" fill="#1c1633"/>
    <rect x="240" y="334" width="0" height="14" rx="7" fill="url(#q)">
      <animate attributeName="width" from="0" to="260" dur="1.6s" begin="0.85s" fill="freeze"/>
    </rect>
    <text x="652" y="346" font-size="12" fill="#a78bfa">65%</text>
  </g>

  <!-- 7 Systems Thinking 85 c -->
  <g font-family="'JetBrains Mono','Courier New',monospace">
    <text x="32" y="396" font-size="13" fill="#cfe3f0">systems_thinking</text>
    <rect x="240" y="384" width="400" height="14" rx="7" fill="#10283a"/>
    <rect x="240" y="384" width="0" height="14" rx="7" fill="url(#c)">
      <animate attributeName="width" from="0" to="340" dur="1.5s" begin="1.0s" fill="freeze"/>
    </rect>
    <text x="652" y="396" font-size="12" fill="#00d4ff">85%</text>
  </g>

  <!-- blinking cursor / status -->
  <text x="32" y="442" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" fill="#5d7689">status: training_in_progress
    <tspan fill="#00d4ff">_</tspan>
  </text>
  <rect x="206" y="432" width="8" height="13" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
